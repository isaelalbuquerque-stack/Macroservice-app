<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <meta name="description" content="Assistente de oficina da Macroservice Inteligência Automotiva">
  <title>Macroservice App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=5.9">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-area">
        <img src="logo.png" alt="Macroservice" class="brand-logo">
        <div class="brand-text">
          <h1>MACROSERVICE</h1>
          <p>INTELIGÊNCIA AUTOMOTIVA</p>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section id="authView" class="view active"></section>
      <section id="homeView" class="view"></section>

      <section id="moduleView" class="view">
        <div class="module-header">
          <button id="backBtn" class="back-btn">‹</button>
          <div>
            <h2 id="moduleTitle">Macroservice</h2>
            <p id="moduleSubtitle">Assistente de oficina</p>
          </div>
        </div>
        <div id="moduleContent" class="module-content"></div>
      </section>
    </main>

    <footer class="footer">
      <strong>MACROSERVICE</strong>
      <span>Inteligência Automotiva</span>
      <small>Juruti - PA</small>
    </footer>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="integrations.js?v=5.9"></script>
  <script src="catalog.js?v=5.9"></script>
  <script src="procedures.js?v=5.9"></script>
  <script src="app.js?v=5.9"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071827">

  <title>Macroservice App</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>

  <main class="app">

    <header class="topo">
      <img src="logo.png" alt="Macroservice" class="logo">
      <div>
        <h1>MACROSERVICE</h1>
        <p>INTELIGÊNCIA AUTOMOTIVA</p>
      </div>
    </header>

    <section class="boas-vindas">
      <h2>Olá! 👋</h2>
      <p>Bem-vindo ao seu assistente de oficina.</p>
    </section>

    <section class="menu">

      <button onclick="abrirModulo('agendamento')">
        <span>📅</span>
        Novo<br>Agendamento
      </button>

      <button onclick="abrirModulo('orcamento')">
        <span>📄</span>
        Orçamento<br>Rápido
      </button>

      <button onclick="abrirModulo('clientes')">
        <span>👥</span>
        Clientes
      </button>

      <button onclick="abrirModulo('veiculos')">
        <span>🚗</span>
        Veículos
      </button>

      <button onclick="abrirModulo('servicos')">
        <span>🛠️</span>
        Serviços
      </button>

      <button onclick="abrirModulo('pecas')">
        <span>⚙️</span>
        Peças
      </button>

      <button onclick="abrirModulo('historico')">
        <span>🕘</span>
        Histórico
      </button>

      <button onclick="abrirModulo('relatorios')">
        <span>📊</span>
        Relatórios
      </button>

      <button onclick="abrirModulo('configuracoes')">
        <span>⚙️</span>
        Configurações
      </button>

    </section>

    <section id="conteudo" class="conteudo">
      <h2>Macroservice App</h2>
      <p>Selecione uma opção acima.</p>
    </section>

    <footer>
      <strong>MACROSERVICE</strong>
      <p>Confiabilidade e tecnologia em diagnóstico e manutenção automotiva.</p>
      <small>Juruti - PA</small>
    </footer>

  </main>

  <script src="app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Service Worker registrado com sucesso"))
        .catch((erro) => console.error("Erro no Service Worker:", erro));
    });
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <meta name="description" content="Assistente de oficina da Macroservice Inteligência Automotiva">
  <title>Macroservice App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-area">
        <img src="logo.png" alt="Macroservice" class="brand-logo">
        <div class="brand-text">
          <h1>MACROSERVICE</h1>
          <p>INTELIGÊNCIA AUTOMOTIVA</p>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section id="homeView" class="view active">
        <div class="welcome">
          <h2>Olá! 👋</h2>
          <p>Bem-vindo ao seu assistente de oficina.</p>
        </div>

        <div class="dashboard-grid">
          <button class="menu-card" data-view="agendamento"><span class="menu-icon">📅</span><strong>Novo Agendamento</strong></button>
          <button class="menu-card" data-view="orcamento"><span class="menu-icon">📄</span><strong>Orçamento Rápido</strong></button>
          <button class="menu-card" data-view="clientes"><span class="menu-icon">👥</span><strong>Clientes</strong></button>
          <button class="menu-card" data-view="veiculos"><span class="menu-icon">🚗</span><strong>Veículos</strong></button>
          <button class="menu-card" data-view="servicos"><span class="menu-icon">🛠️</span><strong>Serviços</strong></button>
          <button class="menu-card" data-view="pecas"><span class="menu-icon">⚙️</span><strong>Peças</strong></button>
          <button class="menu-card" data-view="historico"><span class="menu-icon">🕘</span><strong>Histórico</strong></button>
          <button class="menu-card" data-view="relatorios"><span class="menu-icon">📊</span><strong>Relatórios</strong></button>
          <button class="menu-card" data-view="configuracoes"><span class="menu-icon">⚙️</span><strong>Configurações</strong></button>
        </div>
      </section>

      <section id="moduleView" class="view">
        <div class="module-header">
          <button id="backBtn" class="back-btn">‹</button>
          <div>
            <h2 id="moduleTitle">Macroservice</h2>
            <p id="moduleSubtitle">Assistente de oficina</p>
          </div>
        </div>
        <div id="moduleContent" class="module-content"></div>
      </section>
    </main>

    <footer class="footer">
      <strong>MACROSERVICE</strong>
      <span>Inteligência Automotiva</span>
      <small>Juruti - PA</small>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
